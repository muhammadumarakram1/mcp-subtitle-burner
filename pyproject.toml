[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-subtitle-burner"
version = "1.0.0"
description = "MCP server for subtitle transcription and burning using FFmpeg and Whisper.cpp"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
mcp-subtitle-burner = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.envs.default]
python = "3.11"
